name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Prepare web files and icons
        run: |
          mkdir -p www assets
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png tides-data.js ports-data.js www/
          cp icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/
      - name: Add Android platform
        run: npx cap add android
      - name: Generate app icons
        run: npx capacitor-assets generate --android
      - name: Add location permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Sync
        run: npx cap sync android
      - name: Set app version
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Sign APK with permanent key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.p12"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
            "${BT}apksigner" sign --ks "$RUNNER_TEMP/keystore.p12" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "Navigation-$VERSION.apk" "$APK"
            "${BT}apksigner" verify --print-certs "Navigation-$VERSION.apk"
          else
            echo "::warning::Секреты ключа не заданы, APK подписан временным ключом"
            cp "$APK" "Navigation-$VERSION.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Navigation-${{ env.VERSION }}
          path: Navigation-${{ env.VERSION }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Навигация ${{ env.VERSION }}
          files: Navigation-${{ env.VERSION }}.apk
